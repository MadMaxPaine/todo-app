<div
  class="min-h-screen flex items-center justify-center bg-gray-100 p-4 font-sans"
>
  <div
    class="w-full max-w-md bg-white p-6 rounded-2xl shadow-md flex flex-col gap-3"
  >
    <h2 class="text-xl font-semibold text-gray-800 text-center">Login</h2>

    <!-- EMAIL -->
    <input
      [(ngModel)]="email"
      name="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
      class="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
    />

    <!-- PASSWORD -->
    <input
      [(ngModel)]="password"
      name="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
      class="w-full border rounded-xl px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
    />

    <!-- BUTTON -->
    <button
      (click)="login()"
      class="w-full bg-indigo-600 text-white py-2 rounded-xl font-medium hover:bg-indigo-700 transition"
    >
      Login
    </button>

    <!-- LINK -->
    <a
      routerLink="/register"
      class="text-sm text-center text-indigo-600 hover:underline"
    >
      Don’t have an account?
    </a>

    <!-- ERROR -->
    @if (errorMessage) {
      <p class="text-red-500 text-sm text-center">
        {{ errorMessage }}
      </p>
    }
  </div>
</div>
